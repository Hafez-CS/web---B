<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل کاربری + چت + نمودار</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, rgba(18, 62, 255, 0.736) 0%, rgba(133, 33, 255, 0.788) 100%);
      background-size: 600%;
      animation: colorChange 15s ease infinite;
      min-height: 100vh;
      font-family: 'Vazirmatn', sans-serif;
      overflow-x: hidden;
    }
    @keyframes colorChange {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
    }

    /* ==== سایدبار ==== */
    .sidebar {
      width: 280px;
      min-width: 280px;
      transition: transform 0.35s ease, width 0.35s ease;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 50;
      overflow-y: auto;
      padding: 1rem;
      direction: ltr; /* برای اسکرول صحیح */
    }
    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    /* حالت جمع‌شده */
    .sidebar.collapsed {
      transform: translateX(-100%);
    }
    .sidebar.collapsed ~ .main-wrapper {
      margin-left: 0 !important;
    }

    /* ==== ماسک ==== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: all 0.35s ease;
      backdrop-filter: blur(2px);
    }
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* ==== محتوای اصلی ==== */
    .main-wrapper {
      transition: margin-left 0.35s ease;
      margin-left: 280px;
      min-height: 100vh;
    }
    @media (max-width: 767px) {
      .main-wrapper {
        margin-left: 0 !important;
      }
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }

    /* ==== دکمه منو ==== */
    .menu-btn {
      @apply p-2 rounded-lg bg-white/20 hover:bg-white/30 transition text-white;
    }

    /* ==== متن چپ‌چین در دسکتاپ ==== */
    @media (min-width: 768px) {
      .ltr-text * {
        text-align: left !important;
        direction: ltr;
      }
    }

    /* ==== اسکرول چت ==== */
    #chatContainer {
      max-height: 400px;
      overflow-y: auto;
    }
    #chatContainer::-webkit-scrollbar {
      width: 5px;
    }
    #chatContainer::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="text-gray-900">

  <!-- Overlay -->
  <div id="overlay" class="overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar glass shadow-2xl">
    <div class="flex items-center justify-between mb-6">
      <div class="flex-1 text-center">
        <div class="w-16 h-16 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full mb-3"></div>
        <p class="font-semibold text-lg" id="sidebarUsername">کاربر</p>
        <p class="text-sm text-gray-300" id="sidebarEmail">user@example.com</p>
      </div>
      <button id="closeSidebar" class="menu-btn hidden md:block">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <nav class="space-y-2">
      <button data-tab="dashboard" class="tab-btn w-full text-left active">پیشخوان</button>
      <button data-tab="chat" class="tab-btn w-full text-left">چت + نمودار</button>
      <button data-tab="profile" class="tab-btn w-full text-left">پروفایل</button>
    </nav>
  </aside>

  <!-- Main Wrapper -->
  <div class="main-wrapper flex flex-col">

    <!-- Header -->
    <header class="glass w-full max-w-6xl mx-auto shadow-md p-4 mb-4 flex justify-between items-center gap-3 z-30 sticky top-0">
      <div class="flex items-center gap-3">
        <button id="openSidebar" class="menu-btn">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <h1 class="text-xl md:text-2xl font-bold text-black">پنل کاربری</h1>
      </div>
      <button id="logoutBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition text-sm md:text-base">
        خروج
      </button>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-6xl mx-auto glass p-4 md:p-6 rounded-xl shadow-lg flex-1 ltr-text">

      <!-- Dashboard -->
      <section id="dashboard" class="tab-content space-y-6">
        <h2 class="text-lg md:text-xl font-bold">پیشخوان</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="glass p-4 rounded-xl text-center">
            <p class="text-2xl md:text-3xl font-bold text-indigo-600" id="totalMessages">0</p>
            <p class="text-xs md:text-sm text-gray-300">پیام‌های ارسالی</p>
          </div>
          <div class="glass p-4 rounded-xl text-center">
            <p class="text-2xl md:text-3xl font-bold text-purple-600" id="totalFiles">0</p>
            <p class="text-xs md:text-sm text-gray-300">فایل‌های آپلود شده</p>
          </div>
          <div class="glass p-4 rounded-xl text-center">
            <p class="text-2xl md:text-3xl font-bold text-yellow-600" id="totalCharts">0</p>
            <p class="text-xs md:text-sm text-gray-300">نمودارهای تولید شده</p>
          </div>
        </div>
        <div class="glass p-4 rounded-xl">
          <h3 class="font-semibold mb-2 text-sm md:text-base">آخرین فعالیت‌ها</h3>
          <ul id="activityList" class="text-xs md:text-sm space-y-1 text-gray-300"></ul>
        </div>
      </section>

      <!-- Chat -->
      <section id="chat" class="tab-content hidden flex flex-col h-full">
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 glass mb-4"></div>
        <div class="flex flex-col sm:flex-row gap-2 mb-4">
          <input id="messageInput" type="text" placeholder="پیام خود را بنویسید..."
            class="flex-1 px-4 py-2 rounded-lg bg-white/30 text-gray-900 placeholder-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm"/>
          <button id="sendBtn" class="px-5 py-2 rounded-lg bg-indigo-600 text-white font-semibold shadow-md hover:bg-indigo-700 text-sm">
            ارسال
          </button>
        </div>
        <div class="flex justify-center">
          <input type="file" id="fileUpload" accept=".csv,.xlsx,.xls" class="hidden">
          <label for="fileUpload" class="bg-indigo-600 text-white px-4 py-2 rounded-md cursor-pointer hover:bg-indigo-700 text-xs md:text-sm">
            آپلود فایل (CSV/Excel)
          </label>
        </div>
        <div id="errorMessage" class="text-red-600 text-xs md:text-sm mt-2 hidden text-center"></div>
        <div id="loading" class="text-gray-800 text-xs md:text-sm mt-2 hidden text-center">در حال بارگذاری...</div>
      </section>

      <!-- Profile -->
      <section id="profile" class="tab-content hidden space-y-6">
        <h2 class="text-lg md:text-xl font-bold">پروفایل کاربری</h2>
        <form id="profileForm" class="space-y-4 glass p-5 rounded-xl">
          <div>
            <label class="block text-sm font-medium mb-1">نام کاربری</label>
            <input type="text" id="usernameInput" class="w-full px-4 py-2 rounded-lg bg-white/30 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" required />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">ایمیل</label>
            <input type="email" id="emailInput" class="w-full px-4 py-2 rounded-lg bg-white/30 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" required />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">رمز عبور جدید</label>
            <input type="password" id="passwordInput" class="w-full px-4 py-2 rounded-lg bg-white/30 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm" />
          </div>
          <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition text-sm md:text-base">
            ذخیره تغییرات
          </button>
        </form>
      </section>

    </main>
  </div>

<script>
/* ==================== Global ==================== */
const API_BASE = "http://127.0.0.1:8000/api";
const token = localStorage.getItem('access');
let roomId = null;

/* ==================== DOM ==================== */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const openBtn = document.getElementById('openSidebar');
const closeBtn = document.getElementById('closeSidebar');
const mainWrapper = document.querySelector('.main-wrapper');

const chatContainer = document.getElementById('chatContainer');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const fileUpload = document.getElementById('fileUpload');
const errorMessage = document.getElementById('errorMessage');
const loading = document.getElementById('loading');
const logoutBtn = document.getElementById('logoutBtn');

const sidebarUsername = document.getElementById('sidebarUsername');
const sidebarEmail = document.getElementById('sidebarEmail');
const totalMessagesEl = document.getElementById('totalMessages');
const totalFilesEl = document.getElementById('totalFiles');
const totalChartsEl = document.getElementById('totalCharts');
const activityList = document.getElementById('activityList');

const usernameInput = document.getElementById('usernameInput');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const profileForm = document.getElementById('profileForm');

/* ==================== Sidebar Control ==================== */
function openSidebar() {
  sidebar.classList.remove('collapsed');
  if (window.innerWidth < 768) sidebar.classList.add('open');
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeSidebar() {
  sidebar.classList.add('collapsed');
  if (window.innerWidth < 768) sidebar.classList.remove('open');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

openBtn.addEventListener('click', openSidebar);
closeBtn.addEventListener('click', closeSidebar);
overlay.addEventListener('click', closeSidebar);

// ریسپانسیو
window.addEventListener('resize', () => {
  if (window.innerWidth >= 768) {
    sidebar.classList.remove('collapsed', 'open');
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  } else {
    sidebar.classList.add('collapsed');
    sidebar.classList.remove('open');
  }
});

// شروع: دسکتاپ باز، موبایل بسته
if (window.innerWidth >= 768) {
  sidebar.classList.remove('collapsed');
} else {
  sidebar.classList.add('collapsed');
}

/* ==================== Utility ==================== */
function showError(msg) {
  errorMessage.textContent = msg;
  errorMessage.classList.remove('hidden');
  setTimeout(() => errorMessage.classList.add('hidden'), 5000);
}
function toggleLoading(show) {
  loading.classList[show ? 'remove' : 'add']('hidden');
}
function addMessage(content, isUser = false) {
  const div = document.createElement('div');
  div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
  div.innerHTML = `<div class="max-w-full md:max-w-2xl px-4 py-3 rounded-xl text-sm md:text-base ${isUser ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-900 glass'}">${content}</div>`;
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return div.querySelector('div');
}
function addActivity(text) {
  const li = document.createElement('li');
  li.textContent = `${text} — ${new Date().toLocaleTimeString('fa-IR')}`;
  activityList.prepend(li);
  if (activityList.children.length > 10) activityList.removeChild(activityList.lastChild);
}

/* ==================== Auth ==================== */
async function loadUserProfile() {
  try {
    const res = await fetch(`${API_BASE}/auth/profile/`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.ok) {
      const data = await res.json();
      sidebarUsername.textContent = data.username;
      sidebarEmail.textContent = data.email;
      usernameInput.value = data.username;
      emailInput.value = data.email;
    }
  } catch (e) { console.error(e); }
}
logoutBtn.addEventListener('click', () => {
  localStorage.removeItem('access');
  alert('خارج شدید!');
  location.reload();
});

/* ==================== Tabs ==================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.getElementById(btn.dataset.tab).classList.remove('hidden');
  });
});

/* ==================== Chat & API ==================== */
// (کدهای چت، آپلود، نمودار، پروفایل — بدون تغییر از نسخه قبلی)
async function initRoom() { /* ... */ }
async function loadHistory() { /* ... */ }
async function sendMessage() { /* ... */ }
function drawChartInChat(data) { /* ... */ }
fileUpload.addEventListener('change', /* ... */);
profileForm.addEventListener('submit', /* ... */);
sendBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

/* ==================== Init ==================== */
window.addEventListener('DOMContentLoaded', async () => {
  if (!token) { alert('وارد شوید!'); return; }
  await loadUserProfile();
  await initRoom();
  await loadHistory();
  addMessage('سلام! فایل آپلود کنید');
  addActivity('وارد شدید');
});
</script>

</body>
</html>
