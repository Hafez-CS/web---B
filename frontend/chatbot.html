<!DOCTYPE html>
<html lang="fa" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل کاربری + چت + نمودار</title>

  <!-- Bootstrap 5 RTL -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2"></script>
  <!-- XLSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Vazirmatn -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sidebar-width: 280px;
    }
    [data-bs-theme="dark"] {
      --bs-body-bg: rgb(13, 27, 42);
      --bs-body-color: rgb(233, 236, 239);
      --glass-bg: rgba(0, 0, 0, 0.35);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    body {
      background: linear-gradient(135deg, rgba(18, 62, 255, 0.736), rgba(133, 33, 255, 0.788));
      background-size: 600%;
      animation: gradient 15s ease infinite;
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh;
      transition: background 0.5s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @keyframes gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Glass Effect */
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1rem;
      transition: all 0.3s ease;
    }
    [data-bs-theme="dark"] .glass {
      background: var(--glass-bg);
      border-color: var(--glass-border);
    }

    /* Offcanvas Custom */
    .offcanvas {
      width: var(--sidebar-width) !important;
    }

    /* Main Content */
    .main-content {
      transition: filter 0.3s ease;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* Chat Container */
    #chatContainer {
      max-height: 400px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    #chatContainer::-webkit-scrollbar {
      width: 6px;
    }
    #chatContainer::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    .text-white-50 { color: rgba(255, 255, 255, 0.5) !important; }
    [data-bs-theme="dark"] .text-white-50 { color: rgba(255, 255, 255, 0.7) !important; }
  </style>
</head>
<body>

  <!-- Offcanvas Sidebar on Left (end in RTL) -->
  <div class="offcanvas offcanvas-end glass shadow-lg" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
    <div class="offcanvas-header">
      <div class="d-flex align-items-center w-100">
        <div class="bg-gradient-indigo-purple rounded-circle me-3" style="width: 50px; height: 50px;"></div>
        <div class="flex-grow-1">
          <h5 class="offcanvas-title mb-0 text-white" id="sidebarUsername">کاربر</h5>
          <p class="text-white-50 small mb-0" id="sidebarEmail">user@example.com</p>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
    </div>
    <div class="offcanvas-body p-0">
      <nav class="nav flex-column p-3">
        <button class="nav-link active text-white px-3 py-2 rounded mb-2 d-flex align-items-center" data-tab="dashboard">
          <i class="bi bi-speedometer2 me-2"></i> پیشخوان
        </button>
        <button class="nav-link text-white px-3 py-2 rounded mb-2 d-flex align-items-center" data-tab="chat">
          <i class="bi bi-chat-dots me-2"></i> چت + نمودار
        </button>
        <button class="nav-link text-white px-3 py-2 rounded d-flex align-items-center" data-tab="profile">
          <i class="bi bi-person me-2"></i> پروفایل
        </button>
      </nav>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Header -->
    <header class="glass shadow-sm sticky-top mb-4 p-3">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
            <i class="bi bi-list"></i>
          </button>
          <h1 class="h4 mb-0 text-white">پنل کاربری</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
          <!-- Dark Mode -->
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="darkModeSwitch">
            <label class="form-check-label text-white small" for="darkModeSwitch">
              <i class="bi bi-moon-stars-fill"></i>
            </label>
          </div>
          <button class="btn btn-danger btn-sm" id="logoutBtn">خروج</button>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="container-fluid glass p-4 p-md-5">

      <!-- Dashboard -->
      <section id="dashboard" class="tab-content">
        <h2 class="h5 mb-4 text-white">پیشخوان</h2>
        <div class="row g-3">
          <div class="col-12 col-sm-4">
            <div class="glass p-4 text-center rounded">
              <h3 class="text-indigo fw-bold" id="totalMessages">0</h3>
              <p class="text-white-50 small">پیام‌های ارسالی</p>
            </div>
          </div>
          <div class="col-12 col-sm-4">
            <div class="glass p-4 text-center rounded">
              <h3 class="text-purple fw-bold" id="totalFiles">0</h3>
              <p class="text-white-50 small">فایل‌های آپلود شده</p>
            </div>
          </div>
          <div class="col-12 col-sm-4">
            <div class="glass p-4 text-center rounded">
              <h3 class="text-warning fw-bold" id="totalCharts">0</h3>
              <p class="text-white-50 small">نمودارهای تولید شده</p>
            </div>
          </div>
        </div>
        <div class="glass p-4 mt-4 rounded">
          <h3 class="h6 mb-3 text-white">آخرین فعالیت‌ها</h3>
          <ul class="list-unstyled small text-white-50" id="activityList"></ul>
        </div>
      </section>

      <!-- Chat -->
      <section id="chat" class="tab-content d-none d-flex flex-column" style="min-height: 500px;">
        <div id="chatContainer" class="flex-grow-1 overflow-auto p-3 glass mb-3 rounded"></div>
        <div class="d-flex gap-2 mb-3">
          <input id="messageInput" type="text" class="form-control form-control-sm" placeholder="پیام خود را بنویسید...">
          <button id="sendBtn" class="btn btn-primary btn-sm">
            <i class="bi bi-send"></i>
          </button>
        </div>
        <div class="text-center">
          <input type="file" id="fileUpload" accept=".csv,.xlsx,.xls" class="d-none">
          <label for="fileUpload" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-file-earmark-spreadsheet"></i> آپلود فایل
          </label>
        </div>
        <div id="errorMessage" class="text-danger small mt-2 text-center d-none"></div>
        <div id="loading" class="text-white-50 small mt-2 text-center d-none">در حال بارگذاری...</div>
      </section>

      <!-- Profile -->
      <section id="profile" class="tab-content d-none">
        <h2 class="h5 mb-4 text-white">پروفایل کاربری</h2>
        <form id="profileForm" class="glass p-4 rounded">
          <div class="mb-3">
            <label class="form-label small text-white">نام کاربری</label>
            <input type="text" id="usernameInput" class="form-control form-control-sm" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-white">ایمیل</label>
            <input type="email" id="emailInput" class="form-control form-control-sm" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-white">رمز عبور جدید</label>
            <input type="password" id="passwordInput" class="form-control form-control-sm">
          </div>
          <button type="submit" class="btn btn-primary w-100">ذخیره تغییرات</button>
        </form>
      </section>

    </main>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ==================== Global ==================== */
    const API_BASE = "http://127.0.0.1:8000/api";
    const token = localStorage.getItem('access');
    let roomId = null;

    /* ==================== DOM ==================== */
    const darkModeSwitch = document.getElementById('darkModeSwitch');
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const fileUpload = document.getElementById('fileUpload');
    const errorMessage = document.getElementById('errorMessage');
    const loading = document.getElementById('loading');
    const logoutBtn = document.getElementById('logoutBtn');

    const sidebarUsername = document.getElementById('sidebarUsername');
    const sidebarEmail = document.getElementById('sidebarEmail');
    const totalMessagesEl = document.getElementById('totalMessages');
    const totalFilesEl = document.getElementById('totalFiles');
    const totalChartsEl = document.getElementById('totalCharts');
    const activityList = document.getElementById('activityList');

    const usernameInput = document.getElementById('usernameInput');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const profileForm = document.getElementById('profileForm');

    /* ==================== Dark Mode ==================== */
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
      darkModeSwitch.checked = savedTheme === 'dark';
    }
    darkModeSwitch.addEventListener('change', () => {
      const theme = darkModeSwitch.checked ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', theme);
      localStorage.setItem('theme', theme);
    });

    /* ==================== Tabs ==================== */
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('d-none'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.remove('d-none');
      });
    });

    /* ==================== Utility ==================== */
    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.remove('d-none');
      setTimeout(() => errorMessage.classList.add('d-none'), 5000);
    }
    function toggleLoading(show) {
      loading.classList.toggle('d-none', !show);
    }
    function addMessage(content, isUser = false) {
      const div = document.createElement('div');
      div.className = `d-flex mb-3 ${isUser ? 'justify-content-end' : 'justify-content-start'}`;
      div.innerHTML = `
        <div class="p-3 rounded-3 max-w-75 ${isUser ? 'bg-primary text-white' : 'bg-secondary-subtle text-dark'}">
          ${content}
        </div>`;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div.querySelector('div');
    }
    function addActivity(text) {
      const li = document.createElement('li');
      li.textContent = `${text} — ${new Date().toLocaleTimeString('fa-IR')}`;
      activityList.prepend(li);
      if (activityList.children.length > 10) activityList.removeChild(activityList.lastChild);
    }

    /* ==================== Auth & API (کامل) ==================== */
    async function loadUserProfile() {
      try {
        const res = await fetch(`${API_BASE}/auth/profile/`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          const data = await res.json();
          sidebarUsername.textContent = data.username;
          sidebarEmail.textContent = data.email;
          usernameInput.value = data.username;
          emailInput.value = data.email;
        }
      } catch (e) { console.error(e); }
    }
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('access');
      alert('خارج شدید!');
      location.reload();
    });

    async function initRoom() {
      toggleLoading(true);
      try {
        const res = await fetch(`${API_BASE}/chat/rooms/`, { headers: { 'Authorization': `Bearer ${token}` } });
        const rooms = await res.json();
        if (rooms.length > 0) {
          roomId = rooms[0].user_room_id;
          addMessage(`اتاق شما: ${rooms[0].name}`);
        } else {
          const createRes = await fetch(`${API_BASE}/chat/rooms/create/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ name: "چت جدید" })
          });
          const newRoom = await createRes.json();
          roomId = newRoom.user_room_id;
          addMessage(`اتاق جدید ساخته شد: ${newRoom.name}`);
        }
      } catch (e) {
        console.error(e);
        showError("خطا در بارگذاری روم‌ها");
      }
      toggleLoading(false);
    }

    async function loadHistory() {
      if (!roomId) return;
      try {
        const res = await fetch(`${API_BASE}/chat/rooms/${roomId}/messages/`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        let msgCount = 0, fileCount = 0, chartCount = 0;
        data.timeline.forEach(item => {
          if (item.type === 'message') {
            addMessage(`${item.user_message}: ${item.ai_response || ''}`, item.user_message !== undefined);
            msgCount++;
          }
          if (item.type === 'file') {
            addMessage(`فایل: ${item.file}`);
            fileCount++;
            if (item.analysis_result?.prediction_data) chartCount++;
          }
        });
        totalMessagesEl.textContent = msgCount;
        totalFilesEl.textContent = fileCount;
        totalChartsEl.textContent = chartCount;
      } catch (e) { console.error(e); }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !roomId) return;
      addMessage(text, true);
      addActivity(`پیام جدید: ${text.substring(0, 30)}...`);
      messageInput.value = '';
      toggleLoading(true);
      try {
        const res = await fetch(`${API_BASE}/chat/rooms/${roomId}/messages/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ user_message: text })
        });
        const data = await res.json();
        toggleLoading(false);
        if (res.ok) {
          addMessage(`${data.ai_response}`);
          totalMessagesEl.textContent = parseInt(totalMessagesEl.textContent) + 1;
        } else showError(data.error || 'خطا در ارسال پیام');
      } catch (e) {
        toggleLoading(false);
        showError('خطا در ارتباط با سرور');
        console.error(e);
      }
    }

    function drawChartInChat(predictionData) {
      const container = addMessage(`<div class="chart-wrapper w-100"><canvas></canvas></div>`);
      const canvas = container.querySelector('canvas');
      const ctx = canvas.getContext('2d');

      const actual = predictionData.actual_values || [];
      const predicted = predictionData.predicted_values || [];
      const future = predictionData.future_predictions || [];

      const historicalLength = predicted.length;
      const totalLength = historicalLength + future.length;
      const labels = Array.from({ length: totalLength }, (_, i) => i + 1);

      const futureDataWithNulls = new Array(historicalLength - 1).fill(null).concat([
        predicted[historicalLength - 1],
        ...future
      ]);

      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'واقعی', data: actual, borderColor: 'rgb(75,192,192)', borderWidth: 3, tension: 0.35, fill: false, pointRadius: 3 },
            { label: 'پیش‌بینی‌شده', data: predicted, borderColor: 'rgb(255,99,132)', borderWidth: 3, tension: 0.35, fill: false, pointRadius: 3 },
            { label: 'پیش‌بینی آینده', data: futureDataWithNulls, borderColor: 'rgb(255,206,86)', borderWidth: 3, borderDash: [6, 6], tension: 0.35, fill: false, pointRadius: 3 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom', labels: { color: 'rgb(255,255,255)' } },
            title: { display: true, text: 'نمودار خطی پیش‌بینی داده‌ها', color: 'rgb(255,255,255)', font: { size: 16 } }
          },
          scales: {
            x: { ticks: { color: 'rgb(255,255,255)' }, grid: { color: 'rgba(255,255,255,0.1)' } },
            y: { ticks: { color: 'rgb(255,255,255)' }, grid: { color: 'rgba(255,255,255,0.1)' } }
          }
        }
      });

      totalChartsEl.textContent = parseInt(totalChartsEl.textContent) + 1;
      addActivity('نمودار جدیدی تولید شد');
    }

    fileUpload.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file || !roomId) return;
      addMessage(`آپلود فایل: ${file.name}`, true);
      addActivity(`فایل آپلود شد: ${file.name}`);
      const formData = new FormData();
      formData.append('file', file);
      toggleLoading(true);
      try {
        const res = await fetch(`${API_BASE}/chat/rooms/${roomId}/upload/`, {
          method: 'POST',
          body: formData,
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        toggleLoading(false);
        if (data.success) {
          addMessage(`فایل "${file.name}" آپلود شد`);
          totalFilesEl.textContent = parseInt(totalFilesEl.textContent) + 1;
          if (data.analysis_result?.prediction_data) {
            drawChartInChat(data.analysis_result.prediction_data);
          } else {
            addMessage(`تحلیلی یافت نشد.`);
          }
        } else {
          showError(data.error || 'خطا در پردازش فایل');
        }
      } catch (e) {
        toggleLoading(false);
        showError('خطا در ارتباط با سرور');
        console.error(e);
      }
    });

    profileForm.addEventListener('submit', async e => {
      e.preventDefault();
      const payload = {
        username: usernameInput.value.trim(),
        email: emailInput.value.trim()
      };
      if (passwordInput.value) payload.password = passwordInput.value;

      try {
        const res = await fetch(`${API_BASE}/auth/profile/update/`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          alert('پروفایل با موفقیت به‌روزرسانی شد!');
          loadUserProfile();
          addActivity('پروفایل به‌روزرسانی شد');
        } else {
          showError(data.error || 'خطا در به‌روزرسانی');
        }
      } catch (e) {
        showError('خطا در ارتباط با سرور');
        console.error(e);
      }
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

    /* ==================== Init ==================== */
    window.addEventListener('DOMContentLoaded', async () => {
      if (!token) { alert('لطفاً ابتدا وارد شوید!'); return; }
      await loadUserProfile();
      await initRoom();
      await loadHistory();
      addMessage('سلام! فایل CSV یا Excel آپلود کنید تا نمودارش رو ببینید');
      addActivity('وارد پنل شدید');
    });
  </script>
</body>
</html>
